spring.application.name=backend

# JPA default: in-memory H2 (works without local MySQL). For real MySQL use profile "mysql":
#   SPRING_PROFILES_ACTIVE=mysql   (see application-mysql.properties + backend/.env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:smartcampus;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8081

# MongoDB — /api/resources (set in backend/.env as MONGODB_URI)
spring.data.mongodb.uri=${MONGODB_URI}

# OAuth2 Microsoft (Entra ID / Azure AD)
# Azure redirect URI (register in app): http://localhost:8081/login/oauth2/code/microsoft (match host/port of this server)
# MICROSOFT_TENANT_ID: common (multitenant+personal app), consumers (personal-only app), organizations (work/school only), or tenant GUID.
# Manual endpoints avoid issuer discovery JSON that contains invalid {tenantid} URI templates.
spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID:local-microsoft-client-id}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:local-microsoft-client-secret}
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
spring.security.oauth2.client.registration.microsoft.provider=microsoft
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:common}/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:common}/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:common}/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.microsoft.user-name-attribute=sub
# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
app.frontend.oauth-success-url=${FRONTEND_OAUTH_SUCCESS_URL:http://localhost:5173/login}
app.notifications.admin-email=${ADMIN_NOTIFICATION_EMAIL:admin@smart-campus.local}
# Comma-separated emails that skip the pending-approval step (e.g. first administrator).
app.auth.auto-approve-emails=${APP_AUTH_AUTO_APPROVE_EMAILS:}
# Optional: first-run only — creates one ACTIVE administrator if none exist (use then remove password from env).
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
